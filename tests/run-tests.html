<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survey Storytelling — Unit Tests</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #F9FAFB;
      color: #111827;
      padding: 24px;
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 12px;
      color: #6B7280;
      margin-bottom: 20px;
    }
    #results {
      background: white;
      border: 1px solid #E5E7EB;
      border-radius: 8px;
      padding: 20px;
    }
  </style>
</head>
<body>
  <h1>🧪 Survey Storytelling — Unit Tests</h1>
  <p class="subtitle">Tests ejecutados: <span id="test-count">cargando…</span></p>
  <div id="results">Ejecutando tests…</div>

  <!-- Framework -->
  <script src="test-framework.js"></script>

  <!-- Módulos bajo test -->
  <script src="../zoho-survey/shared/js/config/constants.js"></script>
  <script src="../zoho-survey/shared/js/utils/formatters.js"></script>
  <script src="../zoho-survey/shared/js/utils/metrics.js"></script>
  <script src="../zoho-survey/shared/js/utils/sanitizer.js"></script>
  <script src="../zoho-survey/shared/js/utils/dom-helpers.js"></script>
  <script src="../zoho-survey/shared/js/components/tooltip.js"></script>
  <script src="../zoho-survey/shared/js/components/custom-select.js"></script>
  <script src="../zoho-survey/shared/js/components/multiselect.js"></script>
  <script src="../zoho-survey/shared/js/components/filter-controller.js"></script>
  <script src="../zoho-survey/shared/js/components/sentiment-view.js"></script>

  <!-- Tests -->
  <script src="unit/test-config.js"></script>
  <script src="unit/test-formatters.js"></script>
  <script src="unit/test-metrics.js"></script>
  <script src="unit/test-sanitizer.js"></script>
  <script src="unit/test-sentiment-view.js"></script>
  <script src="unit/test-filter-controller.js"></script>
  <script src="unit/test-insights-ia.js"></script>

  <!-- Render results -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      // Pequeño delay para asegurar que todos los tests asíncronos terminen
      setTimeout(() => {
        if (window.TestFramework) {
          window.TestFramework.renderTo('results');
          const s = window.TestFramework.summary();
          document.getElementById('test-count').textContent =
            `${s.total} (${s.passed} ✓, ${s.failed} ✗)`;
        }
      }, 200);
    });
  </script>
</body>
</html>
