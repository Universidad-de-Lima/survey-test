name: Zoho Inbox

# Bandeja de entrada de respuestas de Zoho Survey.
#
# Dos formas de alimentarla:
#   1. Automática: Zoho Survey empuja cada respuesta con un Webhook
#      (Builder -> Hub -> Triggers -> Webhook). Ese envío llega como el evento
#      repository_dispatch de tipo "zoho_response".
#   2. Manual (para pruebas): pestaña Actions -> "Zoho Inbox" -> "Run workflow",
#      pegando la respuesta en JSON. No requiere ningún token.
#
# Este flujo NO ejecuta el ETL ni publica nada: solo deja la respuesta
# registrada (enmascarada y sin duplicados) en data/zoho_pendientes/. El
# procesamiento se hace después, agrupado, para no lanzar una corrida de
# análisis de IA por cada respuesta recibida.

on:
  repository_dispatch:
    types: [zoho_response]

  workflow_dispatch:
    inputs:
      payload_json:
        description: 'Respuesta de Zoho en JSON (solo para pruebas manuales)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  # Una respuesta a la vez: evita que dos envíos simultáneos se pisen al
  # escribir el archivo de pendientes. No se cancela ninguno.
  group: zoho-inbox
  cancel-in-progress: false

jobs:
  recibir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar la respuesta recibida
        env:
          # El cuerpo llega en client_payload (webhook) o en el campo del
          # formulario (prueba manual). Se pasa por variable de entorno para
          # no romper el entrecomillado del shell.
          PAYLOAD_WEBHOOK: ${{ toJson(github.event.client_payload) }}
          PAYLOAD_MANUAL: ${{ inputs.payload_json }}
          ORIGEN: ${{ github.event_name }}
        run: |
          mkdir -p /tmp/zoho
          if [ "$ORIGEN" = "repository_dispatch" ]; then
            printf '%s' "$PAYLOAD_WEBHOOK" > /tmp/zoho/payload.json
          else
            printf '%s' "$PAYLOAD_MANUAL" > /tmp/zoho/payload.json
          fi
          echo "Respuesta recibida (primeros 200 caracteres):"
          head -c 200 /tmp/zoho/payload.json
          echo

      - name: Registrar la respuesta (enmascarada y sin duplicados)
        # Falla explícitamente si la respuesta no es JSON válido o si le falta
        # el identificador de respuesta o el nombre de la encuesta: es el aviso
        # de que hay que corregir la configuración del webhook en Zoho.
        run: python3 zoho-survey/scripts/zoho_inbox.py /tmp/zoho/payload.json

      - name: Guardar el pendiente (solo si cambió)
        run: |
          if [ -z "$(git status --porcelain data/zoho_pendientes)" ]; then
            echo "Sin cambios: la respuesta ya estaba registrada."
            exit 0
          fi
          git config user.name "zoho-inbox[bot]"
          git config user.email "zoho-inbox@users.noreply.github.com"
          git add data/zoho_pendientes
          git commit -m "chore(zoho): registrar respuesta recibida por webhook"
          git push
          echo "Pendientes guardados:"
          git show --stat --oneline HEAD | head -5
