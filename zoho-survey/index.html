<head>

<meta name="description" content="Encuestas de Satisfacción — Universidad de Lima" />
<title>Encuestas de Satisfacción — Universidad de Lima</title>
<link rel="icon" href="shared/img/favicon.png" type="image/x-icon" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
<!-- Tokens canónicos (tokens.css). Debe cargarse antes que cualquier CSS del portal -->

<!-- CSS del portal (modular: base + components + sections) -->
<link rel="stylesheet" href="shared/css/portal/portal-base.css?v=2026092616">
<link rel="stylesheet" href="shared/css/portal/portal-components.css?v=2026092616">
<link rel="stylesheet" href="shared/css/portal/portal-sections.css?v=2026092616">

     sus reglas deben poder ajustar las de las hojas anteriores (ver ARCHITECTURE.md). -->
<link rel="stylesheet" href="shared/css/generated.css?v=2026092616">
</head>
<body>
<div class="app">
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <button class="icon-btn hamburger" id="hamburgerBtn" aria-label="Toggle navigation">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
      </button>
      <div class="brand">
        <img src="shared/img/logo-horizontal_black.png" alt="Universidad de Lima" class="logo-cabecera">
      </div>
      <div class="header-actions">
        <button class="btn-dashboard active" id="dashboardBtn" title="Dashboard">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
          <span>Dashboard</span>
        </button>
        <button class="icon-btn" id="refreshBtn" aria-label="Actualizar" title="Actualizar">
          <svg id="refreshIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Body -->
  <div class="body">
    <!-- Desktop sidebar -->
    <aside class="sidebar portal-scrollbar" id="sidebarDesktop"></aside>

    <!-- Mobile drawer -->
    <div class="mobile-overlay" id="mobileOverlay">
      <div class="mobile-drawer">
        <div class="mobile-drawer-header">
          <span>Navegación</span>
          <button class="icon-btn" id="closeMobileBtn" aria-label="Close">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <div class="mobile-drawer-body" id="sidebarMobile"></div>
      </div>
    </div>

    <!-- Main -->
    <main class="main">
      <div class="main-scroll portal-scrollbar" id="mainScroll">
        <div id="mainContent"></div>
      </div>
    </main>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-brand">
      <img src="shared/img/favicon.png" alt="" class="icono-chico">
      Fuente: Zoho Survey
      <span class="dot-sep">·</span>
      <span class="footer-sub">Dirección de Planificación y Acreditación</span>
    </div>
    <div class="fila-separada">
      <span><span id="footerCompleted"></span>/<span id="footerTotal"></span> ítems</span>
      <span class="texto-tenue">·</span>
      <span id="footerDate" class="texto-tenue"></span>
    </div>
  </footer>
</div>


<!-- Scripts del portal (orden crítico: config → utils → components → portal modules) -->
<script src="shared/js/config/constants.js?v=2026092616" defer></script>
<script src="shared/js/utils/sanitizer.js?v=2026092616" defer></script>
<script src="shared/js/components/tooltip.js?v=2026092616" defer></script>
<script src="shared/js/utils/dom-helpers.js?v=2026092616" defer></script>
<script src="shared/js/utils/formatters.js?v=2026092616" defer></script>
<script src="shared/js/components/sentiment-view.js?v=2026092616" defer></script>
<script src="shared/js/components/custom-select.js?v=2026092616" defer></script>
<script src="shared/js/components/multiselect.js?v=2026092616" defer></script>
<script src="shared/js/portal/portal-data.js?v=2026092616" defer></script>
<script src="shared/js/portal/portal-dashboard.js?v=2026092616" defer></script>
<script src="shared/js/portal/portal-radar.js?v=2026092616" defer></script>
<script src="shared/js/portal/portal-filters.js?v=2026092616" defer></script>
<script src="shared/js/portal/portal-survey.js?v=2026092616" defer></script>
<script src="shared/js/portal.js?v=2026092616" defer></script>
</body>
</html>
